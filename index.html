<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid - Crypto, Fiat & Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (typeof process === 'undefined') {
        window.process = { env: { API_KEY: "" } };
      }
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              nebula: ['Orbitron', 'sans-serif'],
            },
            colors: {
              slate: {
                850: '#151e32',
                950: '#020617',
              },
              fluid: {
                cyan: '#22d3ee',
                indigo: '#818cf8',
                purple: '#a855f7',
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.3s ease-out',
              'glow-pulse': 'glowPulse 2s infinite',
              'spin-slow': 'spin 8s linear infinite',
              'bounce-slow': 'bounce 3s infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              glowPulse: {
                '0%, 100%': { boxShadow: '0 0 5px rgba(139, 92, 246, 0.3)' },
                '50%': { boxShadow: '0 0 20px rgba(139, 92, 246, 0.6)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        color: white;
      }
      .font-nebula { font-family: 'Orbitron', sans-serif; }
      
      .bg-fluid-gradient {
        background: linear-gradient(135deg, #22d3ee 0%, #818cf8 50%, #a855f7 100%);
      }

      .text-fluid-gradient {
        background: linear-gradient(to right, #22d3ee, #818cf8, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
      }

      .text-glow-cyan {
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
      }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }

      .bg-tech-grid {
        background-size: 50px 50px;
        background-image: 
          linear-gradient(to right, rgba(99, 102, 241, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
      }

      .scroll-card {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .scroll-card.in-view {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .custom-tooltip-trigger:hover .custom-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .perspective-1000 {
        perspective: 1000px;
      }
      
      .rotate-y-6 { transform: rotateY(6deg); }
      .rotate-x-6 { transform: rotateX(6deg); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
    "thirdweb": "https://esm.sh/thirdweb@5.54.0?deps=react@18.2.0,react-dom@18.2.0",
    "thirdweb/react": "https://esm.sh/thirdweb@5.54.0/react?deps=react@18.2.0,react-dom@18.2.0",
    "thirdweb/wallets": "https://esm.sh/thirdweb@5.54.0/wallets?deps=react@18.2.0,react-dom@18.2.0",
    "thirdweb/chains": "https://esm.sh/thirdweb@5.54.0/chains?deps=react@18.2.0,react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "thirdweb/": "https://esm.sh/thirdweb@^5.118.0/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
  </head>
  <body class="bg-slate-950 text-white overflow-x-hidden selection:bg-indigo-500/30">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
